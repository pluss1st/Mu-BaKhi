name: Build APK MU Online

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Cho phep chay thu cong

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache Buildozer
      uses: actions/cache@v3
      with:
        path: |
          ~/.buildozer
          ~/.cache
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3-pip git zip unzip \
          openjdk-17-jdk \
          autoconf automake libtool \
          pkg-config zlib1g-dev \
          libncurses5-dev libffi-dev \
          libssl-dev build-essential \
          ccache
        pip3 install buildozer cython==0.29.36 virtualenv

    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build.log

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: MUOnline-Offline-APK
        path: bin/*.apk
        retention-days: 30

    - name: Upload build log (neu loi)
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: build-log
        path: build.log
